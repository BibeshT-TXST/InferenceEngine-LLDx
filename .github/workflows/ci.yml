name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Apple Silicon (arm64). Pinned instead of macos-latest so the image only changes on purpose.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2
      - name: Tests (tiers 1 and 2)
        run: cargo nextest run --workspace --profile ci --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Dependency policy (advisories, licenses, bans, sources)
        run: cargo deny check
